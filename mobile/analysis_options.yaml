# Sports Gurukul Mobile - static analysis configuration.
#
# Strict linting baseline: very_good_analysis (supersets flutter_lints).
# Target: zero analyzer warnings before merge.
#
# Intentionally disabled rules (documented in docs/09-Engineering-Standards.md):
#   - public_member_api_docs: disabled. This is an internal application, not
#     a distributable package. Class-level docs are required by convention;
#     member-level docs are added for non-trivial APIs only.
#
# Generated code is excluded from analysis: l10n output regenerated by
# `flutter gen-l10n` (uses relative imports), and build_runner output in a
# later phase.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - lib/l10n/generated/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart

formatter:
  trailing_commas: preserve

linter:
  rules:
    public_member_api_docs: false
