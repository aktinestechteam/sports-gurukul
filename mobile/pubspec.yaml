name: sports_gurukul
description: >-
  Sports Gurukul Mobile - Enterprise Flutter application for the AI-first
  digital sports ecosystem. Role-based app for Athlete, Parent, Coach,
  Academy and Super Admin users. Sprint 0 project foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  intl: 0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
