name: sports_gurukul
description: >-
  Sports Gurukul Mobile - Enterprise Flutter application for the AI-first
  digital sports ecosystem. Role-based app for Athlete, Parent, Coach,
  Academy and Super Admin users. Sprint 0 project foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: 0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
